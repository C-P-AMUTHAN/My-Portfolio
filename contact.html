      margin-bottom: 20px;

    }

      width: 100%;

      border: 1px solid #ccc;

      font-size: 16px;

    .form-group input:focus,

  <script>
    // Starfield background
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('starfield-canvas'), alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    const starGeometry = new THREE.SphereGeometry(0.1, 24, 24);
    const starMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const stars = [];
    for (let i = 0; i < 2000; i++) {
      const star = new THREE.Mesh(starGeometry, starMaterial);
      star.position.set((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200);
      stars.push(star);
      scene.add(star);
    }
    camera.position.z = 5;
    function animate() {
      requestAnimationFrame(animate);
      stars.forEach(star => {
        star.position.z += 0.1;
        if (star.position.z > camera.position.z) star.position.z = -100;
      });
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

  <script>
    // Page transition script
    document.querySelectorAll('.navbar a').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const href = link.getAttribute('href');
        document.body.classList.remove('fade-in');
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location.href = href;
        }, 500);
      });
    });
